[package]
name = "unfold"
version = "1.0.0"
description = "A private space for deeper thinking"
authors = ["Teri Kolman 66"]
edition = "2021"

[lib]
name = "unfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
